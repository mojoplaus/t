    * {

      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      background: #050505;
      color: #fff;
      overflow-x: hidden;
    }

    .hero {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      background:
        linear-gradient(120deg, rgba(0,0,0,.95), rgba(0,0,0,.55)),

      background-size: cover;
      background-position: center;
    }

    .hero::after {

      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(212,175,55,.18), transparent 45%);
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 2;

      text-align: center;
      padding: 60px 40px;
      border: 1px solid rgba(212,175,55,.22);
      background: rgba(255,255,255,.045);
      backdrop-filter: blur(24px);
      border-radius: 34px;
      box-shadow: 0 40px 120px rgba(0,0,0,.65);
    }

    .badge {
      display: inline-block;
      margin-bottom: 28px;
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid rgba(212,175,55,.45);
      color: #d4af37;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(46px, 7vw, 96px);
      line-height: .95;
      letter-spacing: -4px;
      margin-bottom: 28px;
      font-weight: 800;
    }

    h1 span {
      color: #d4af37;
    }

    p {
      max-width: 720px;
      margin: 0 auto 38px;
      color: rgba(255,255,255,.72);
      font-size: clamp(18px, 2vw, 23px);
      line-height: 1.55;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 18px 34px;
      border-radius: 999px;
      background: linear-gradient(135deg, #d4af37, #f4dc8c);
      color: #080808;
      font-weight: 800;
      font-size: 16px;
      text-decoration: none;
      box-shadow: 0 0 45px rgba(212,175,55,.35);
      transition: .35s ease;
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 0 70px rgba(212,175,55,.55);
    }

    .features {
      margin-top: 34px;
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      color: rgba(255,255,255,.72);
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .features span {
      padding: 12px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
    }

    @media (max-width: 600px) {
      .hero {
        padding: 20px;

      .content {

      }

      h1 {
